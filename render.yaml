# Render Blueprint — deploy Pryntis Panel with one click
# https://render.com/docs/blueprint-spec
#
# After first deploy, run the DB schema + seed via Render Shell:
#   npm run db:schema && npm run db:seed

databases:
  - name: pryntis-db
    plan: free
    databaseName: pryntis
    user: pryntis

services:
  - type: web
    name: pryntis-panel
    runtime: node
    plan: free
    region: oregon
    numInstances: 1
    buildCommand: npm install && cd client && npm install --include=dev && npm run build
    startCommand: node server/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: DATABASE_URL
        fromDatabase:
          name: pryntis-db
          property: connectionString
