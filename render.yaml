# Render Blueprint — deploy Pryntis Panel with one click
# https://render.com/docs/blueprint-spec

databases:
  - name: pryntis-db
    plan: free
    databaseName: pryntis
    user: pryntis

services:
  - type: web
    name: pryntis-panel
    runtime: node
    plan: free
    buildCommand: npm install && npm run client:install && npm run build:prod
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: DATABASE_URL
        fromDatabase:
          name: pryntis-db
          property: connectionString
